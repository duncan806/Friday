[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "A terminal you hand a goal to: Claude directs (read-only), Codex builds (no authority) — you watch them work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
friday = "friday.cli:main"

# Windows: a no-console (pythonw) entry so a desktop shortcut opens only the
# app window—no second terminal window. On other platforms it behaves like friday.
[project.gui-scripts]
fridayw = "friday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
friday = ["data/**"]
